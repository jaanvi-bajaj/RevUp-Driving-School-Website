<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RevUp Driving School - Booking Confirmation</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="container nav-row">
      <a href="home.html" class="brand logo"><i class="fas fa-car-side"></i>RevUp Driving School</a>
      
      <nav class="nav-links" id="desktopNav">
        <a href="home.html" class="nav-link">Home</a>
        <a href="packages.html" class="nav-link">Packages</a>
        <a href="booking.html" class="nav-link">Booking</a>
      </nav>

      <div style="display:flex;align-items:center;gap:10px">
        <a href="booking.html" class="cta">Book Now</a>
        <button class="menu-btn" id="menu-btn" aria-label="menu"><i class="fas fa-bars"></i></button>
      </div>
    </div>

    <div class="container mobile-menu" id="mobile-nav">
      <a href="home.html" class="mobile-link">Home</a>
      <a href="packages.html" class="mobile-link">Packages</a>
      <a href_package="booking.html" class="mobile-link">Booking</a>
    </div>
  </header>

  <main class="container" id="mainContent">

    <section id="page-confirmation">
      <div class="confirm">
        <div class="tick"><i class="fas fa-check-circle"></i></div>
        <h1>Thank You!</h1>
        <div id="confirm-msg" style="color:#6b7280;margin-top:8px">
          <p>Your booking is confirmed.</p>
        </div>
        <p style="color:#6b7280;margin-top:8px">We've received your booking and will contact you shortly.</p>
        <a href="home.html" class="cta" style="margin-top:14px;display:inline-block">Back to Home</a>
      </div>
    </section>

  </main>

  <footer>
    <div class="container" style="text-align:center">
      <p style="font-weight:600">&copy; 2025 RevUp Driving School.</p>
      <p style="color:rgba(255,255,255,0.75)"><i class="fas fa-map-marker-alt" style="margin-right:8px"></i>123 Business Avenue, Sheikh Zayed Road, Dubai, UAE</p>
      <p style="color:rgba(255,255,255,0.75)"><i class="fas fa-mobile-alt" style="margin-right:8px"></i>Call Us: +971 56 646 3360</p>
      <div class="socials" style="margin-top:12px">
        <a href="#"><i class="fab fa-facebook"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
  
  <script>
    // runs when the page is loaded
    window.onload = function() {
      // get the stuff we saved from the booking page
      var studentName = localStorage.getItem('studentName');
      var pkgName = localStorage.getItem('packageName');
      
      var msgBox = document.getElementById('confirm-msg');
      
      if (studentName && pkgName) {
        // if we found the info, show it
        msgBox.innerHTML = '<p>Thanks, <strong>' + studentName + '</strong>!</p>'
                         + '<p>Your booking for the <strong>' + pkgName + '</strong> is all set.</p>';
      } else {
        // just in case they land here by mistake
        msgBox.innerHTML = '<p>Your booking is confirmed!</p>';
      }
      
      // clear it so it's not there next time
      localStorage.removeItem('studentName');
      localStorage.removeItem('packageName');
    }
  </script>

</body>
</html>
